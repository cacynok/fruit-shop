<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Товар</title>

<style>
body {
    font-family: Arial;
    background: #e8f5e9;
    text-align: center;
    padding: 20px;
}

img {
    width: 300px;
    height: 300px;
    object-fit: contain;
}

button {
    padding: 10px 20px;
    background: green;
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
}
</style>
</head>

<body>

<h1 id="title"></h1>
<img id="image">
<p id="desc"></p>
<p id="info"></p>

<p id="info"></p>

<p>Выберите вес:</p>

<select id="weight">
    <option value="0.5">0.5 кг</option>
    <option value="1">1 кг</option>
    <option value="2">2 кг</option>
</select>

<button onclick="addToCart()">🛒 В корзину</button>
<br><br>
<button onclick="goBack()">⬅ Назад</button>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];

const data = {
apple:{title:"Яблоки",img:"https://upload.wikimedia.org/wikipedia/commons/1/15/Red_Apple.jpg",desc:"Свежие яблоки",info:"52 ккал"},
banana:{title:"Бананы",img:"https://upload.wikimedia.org/wikipedia/commons/8/8a/Banana-Single.jpg",desc:"Сладкие бананы",info:"89 ккал"},
orange:{title:"Апельсины",img:"https://upload.wikimedia.org/wikipedia/commons/c/c4/Orange-Fruit-Pieces.jpg",desc:"Много витамина C",info:"47 ккал"},
grape:{title:"Виноград",img:"https://upload.wikimedia.org/wikipedia/commons/9/9a/Table_grapes.jpg",desc:"Сладкий виноград",info:"69 ккал"},
strawberry:{title:"Клубника",img:"https://upload.wikimedia.org/wikipedia/commons/2/29/PerfectStrawberry.jpg",desc:"Сочная клубника",info:"33 ккал"},
pineapple:{title:"Ананас",img:"https://upload.wikimedia.org/wikipedia/commons/c/cb/Pineapple_and_cross_section.jpg",desc:"Экзотический фрукт",info:"50 ккал"},
mango:{title:"Манго",img:"https://upload.wikimedia.org/wikipedia/commons/9/90/Hapus_Mango.jpg",desc:"Сладкий манго",info:"60 ккал"},
kiwi:{title:"Киви",img:"https://upload.wikimedia.org/wikipedia/commons/d/d3/Kiwi_aka.jpg",desc:"Кисло-сладкий",info:"61 ккал"},
pear:{title:"Груша",img:"https://upload.wikimedia.org/wikipedia/commons/f/f4/Pear.jpg",desc:"Сочная груша",info:"57 ккал"},
watermelon:{title:"Арбуз",img:"https://upload.wikimedia.org/wikipedia/commons/e/eb/Watermelon_cross_BNC.jpg",desc:"Освежающий",info:"30 ккал"}
};

const params = new URLSearchParams(window.location.search);
const product = params.get("name");

const item = data[product];

document.getElementById("title").innerText = item.title;
document.getElementById("image").src = item.img;
document.getElementById("desc").innerText = item.desc;
document.getElementById("info").innerText = item.info;

function addToCart() {
    let weight = document.getElementById("weight").value;

    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    cart.push({
        name: item.title,
        price: 2, // можно потом сделать разную цену
        weight: weight
    });

    localStorage.setItem("cart", JSON.stringify(cart));

    alert("Добавлено в корзину!");
}
}

function goBack() {
    window.location.href = "index.html";
}
</script>

</body>
</html>
