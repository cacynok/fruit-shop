<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Магазин фруктов</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background: #f0f8f0;
img {
    width: 100%;
    border-radius: 10px;
}
        }

        header {
            background: green;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            padding: 20px;
        }

        .products {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .card {
            background: white;
            padding: 15px;
            border-radius: 10px;
            width: 200px;
            text-align: center;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        button {
            background: green;
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background: darkgreen;
        }

        footer {
            text-align: center;
            padding: 15px;
            background: #ddd;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<header>
    <h1>🍎 Магазин фруктов</h1>
    <p>Свежие фрукты каждый день</p>
</header>

<div class="container">
    <h2>Наши товары</h2>

    <div class="products">

        <div class="card">
    <h3>Яблоки</h3>

    <img src="https://upload.wikimedia.org/wikipedia/commons/1/15/Red_Apple.jpg">

    <p>2€ за кг</p>
    <button onclick="buy('Яблоки')">Купить</button>
</div>

        <div class="card">
            <h3>Бананы</h3>
            <p>1.5€ за кг</p>
            <button onclick="buy('Бананы')">Купить</button>
        </div>

        <div class="card">
            <h3>Апельсины</h3>
            <p>2.2€ за кг</p>
            <button onclick="buy('Апельсины')">Купить</button>
        </div>

    </div>
</div>

<footer>
    <p>📧 fruitshop@email.com</p>
</footer>

<script>
function buy(product) {
    alert("Вы выбрали: " + product);
}
</script>

</body>
</html>
