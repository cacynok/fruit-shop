<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Fruit Shop</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #e8f5e9;
    background-image: url('https://www.transparenttextures.com/patterns/food.png');
}

header {
    background: linear-gradient(90deg, #81c784, #a5d6a7);
    color: white;
    text-align: center;
    padding: 20px;
}

.container {
    padding: 20px;
}

.products {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 20px;
}

.card {
    background: #ffffff;
    border-radius: 15px;
    padding: 15px;
    text-align: center;
    cursor: pointer;
    transition: 0.2s;
}

.card:hover {
    transform: scale(1.05);
}

.card img {
    width: 100%;
    height: 150px;
    object-fit: contain;
}

</style>
</head>

<body>

<header>
    <h1>🍎 Магазин фруктов</h1>
</header>

<div class="container">
    <div class="products">

        <div class="card" onclick="openProduct('apple')">
            <h3>Яблоки</h3>
            <img src="https://upload.wikimedia.org/wikipedia/commons/1/15/Red_Apple.jpg">
        </div>

        <div class="card" onclick="openProduct('banana')">
            <h3>Бананы</h3>
            <img src="https://upload.wikimedia.org/wikipedia/commons/8/8a/Banana-Single.jpg">
        </div>

        <div class="card" onclick="openProduct('orange')">
            <h3>Апельсины</h3>
            <img src="https://upload.wikimedia.org/wikipedia/commons/c/c4/Orange-Fruit-Pieces.jpg">
        </div>

        <div class="card" onclick="openProduct('grape')">
            <h3>Виноград</h3>
            <img src="https://upload.wikimedia.org/wikipedia/commons/9/9a/Table_grapes.jpg">
        </div>

    </div>
</div>

<script>
function openProduct(product) {
    window.location.href = "product.html?name=" + product;
}
</script>

</body>
</html>
