<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Fruit Shop</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #f5f5f5;
}

header {
    background: linear-gradient(90deg, green, limegreen);
    color: white;
    text-align: center;
    padding: 20px;
}

.container {
    padding: 20px;
}

.products {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 20px;
}

.card {
    background: white;
    border-radius: 15px;
    padding: 15px;
    text-align: center;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}

.card img {
    width: 100%;
    height: 150px;
    object-fit: cover;
    border-radius: 10px;
}

button {
    background: green;
    color: white;
    border: none;
    padding: 10px;
    border-radius: 8px;
    cursor: pointer;
}

button:hover {
    background: darkgreen;
}

.cart {
    position: fixed;
    right: 0;
    top: 0;
    width: 250px;
    height: 100%;
    background: white;
    box-shadow: -3px 0 10px rgba(0,0,0,0.2);
    padding: 15px;
}

.cart h2 {
    margin-top: 0;
}

.cart-item {
    border-bottom: 1px solid #ddd;
    padding: 5px 0;
}

.total {
    font-weight: bold;
    margin-top: 10px;
}
</style>
</head>

<body>

<header>
    <h1>🍎 Магазин фруктов</h1>
    <p>Свежие фрукты каждый день</p>
</header>

<div class="container">
    <h2>Наши товары</h2>

    <div class="products">

        <div class="card">
            <h3>Яблоки</h3>
            <img src="https://upload.wikimedia.org/wikipedia/commons/1/15/Red_Apple.jpg">
            <p>2€</p>
            <button onclick="addToCart('Яблоки', 2)">Купить</button>
        </div>

        <div class="card">
            <h3>Бананы</h3>
            <img src="https://upload.wikimedia.org/wikipedia/commons/8/8a/Banana-Single.jpg">
            <p>1.5€</p>
            <button onclick="addToCart('Бананы', 1.5)">Купить</button>
        </div>

        <div class="card">
            <h3>Апельсины</h3>
            <img src="https://upload.wikimedia.org/wikipedia/commons/c/c4/Orange-Fruit-Pieces.jpg">
            <p>2.2€</p>
            <button onclick="addToCart('Апельсины', 2.2)">Купить</button>
        </div>

    </div>
</div>

<div class="cart">
    <h2>🛒 Корзина</h2>
    <div id="cart-items"></div>
    <div class="total">Итого: <span id="total">0</span> €</div>
</div>

<script>
let cart = [];
let total = 0;

function addToCart(name, price) {
    cart.push({name, price});
    total += price;
    renderCart();
}

function removeItem(index) {
    total -= cart[index].price;
    cart.splice(index, 1);
    renderCart();
}

function renderCart() {
    const cartDiv = document.getElementById("cart-items");
    cartDiv.innerHTML = "";

    cart.forEach((item, index) => {
        cartDiv.innerHTML += `
            <div class="cart-item">
                ${item.name} - ${item.price}€
                <button onclick="removeItem(${index})">❌</button>
            </div>
        `;
    });

    document.getElementById("total").innerText = total.toFixed(2);
}
</script>

</body>
</html>
